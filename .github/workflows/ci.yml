name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

permissions: {}

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      # A pull request's checkout is the merge commit, whose first parent is its base; a push is compared with main
      # before it, and when that commit is not in the checkout the self-test runs.
      - name: Whether the queue tools changed
        id: tools
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ]; then base=$BEFORE; fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git diff --quiet "$base" HEAD -- tools .github/workflows/ci.yml; then
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      # tools/emu runs its command in an unprivileged user and mount namespace, which Ubuntu's AppArmor restricts.
      - name: Allow unprivileged user namespaces
        if: steps.tools.outputs.run == 'true'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Queue self-test
        if: steps.tools.outputs.run == 'true'
        run: tools/selftest
        env:
          KIROKU_SELFTEST_REQUIRE_Q: "1"

      - name: Install the SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.2"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # The newest state main saved; only main saves.
      - name: Restore the Gradle home
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}-
            gradle-${{ runner.os }}-

      # Robolectric fetches its Android jars from Maven Central while the tests run; main's newest set is restored.
      - name: Restore Robolectric's Android jars
        id: robolectric
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ github.sha }}
          restore-keys: robolectric-${{ runner.os }}-

      # A push's debug build carries the client id, so it is built on its own; the release and preview builds run
      # after the tests, which share the runner's cores with nothing. The summary names the memory in use at its peak.
      - name: Format, Lint, tests and screenshots
        env:
          DEBUG_BUILD: ${{ github.event_name == 'pull_request' && 'assembleDebug' || '' }}
        run: |
          memory="$RUNNER_TEMP/memory"
          while sleep 2; do awk '/^MemTotal/ { t = $2 } /^MemAvailable/ { a = $2 } END { print int((t - a) / 1024) }' /proc/meminfo; done > "$memory" &
          sampler=$!
          status=0
          ./gradlew --continue ktlintCheck lint test recordRoborazziDebug $DEBUG_BUILD || status=$?
          kill "$sampler"
          echo "Memory in use at its peak: $(sort -n "$memory" | tail -n 1) of $(awk '/^MemTotal/ { print int($2 / 1024) }' /proc/meminfo) MiB" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Name the runner image of the screenshots
        if: success() || failure()
        run: |
          if [ -d app/build/outputs/roborazzi ]; then
            echo "$ImageOS $ImageVersion" > app/build/outputs/roborazzi/RUNNER_IMAGE
          fi

      - name: Keep the screenshots
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

      - name: Test the screenshot comparison
        if: github.event_name == 'pull_request'
        run: .github/scripts/changed-screenshots-test

      # A report, not a check: main's set is that of the run for the base commit, else main's newest green run.
      - name: Screenshots that differ from main's
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base=$(git rev-parse HEAD^1)
          runs="repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1"
          run=$(gh api "$runs&head_sha=$base" --jq '.workflow_runs[0].id // empty' || true)
          if [ -z "$run" ]; then
            run=$(gh api "$runs" --jq '.workflow_runs[0].id // empty' || true)
            note="Main's run for the base commit \`$base\` has not passed, so the set is of another commit of main and the changes between the two show too."
          fi
          main="$RUNNER_TEMP/main-screenshots"
          if [ -n "$run" ] && gh run download "$run" --name screenshots --dir "$main"; then
            {
              .github/scripts/changed-screenshots "$main" app/build/outputs/roborazzi
              echo
              echo "${note:-}"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Main's screenshots are missing or expired, so none were compared." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Debug build with the client id
        if: github.event_name == 'push'
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: ./gradlew assembleDebug

      - name: Release build with R8 and its guards, and the preview build
        run: ./gradlew assembleRelease assemblePreview

      - name: Name Robolectric's Android jars
        id: jars
        if: github.event_name == 'push'
        run: |
          jars=~/.m2/repository/org/robolectric/android-all-instrumented
          if [ -d "$jars" ]; then
            echo "key=robolectric-$RUNNER_OS-$(ls "$jars" | sha256sum | cut -c 1-16)" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Robolectric's Android jars
        if: steps.jars.outputs.key != '' && steps.jars.outputs.key != steps.robolectric.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.jars.outputs.key }}

      - name: Save the Gradle home
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}-${{ github.sha }}

      - name: Keep the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kiroku-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Keep the unsigned release APK and its R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kiroku-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/
          if-no-files-found: ignore
          retention-days: 14
