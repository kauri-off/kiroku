# Limits of Kiroku's job queue. tools/q reads this file again at every decision, so a change applies to the
# next job that starts. Memory is in MiB; `tools/q stats` shows what the jobs really used.

[queue]
budget_mib = 20000    # the declared memory of all running jobs together
margin_mib = 1500     # available memory that must be left over after a starting job's own figure
cpu_reserve = 4       # threads of the machine that are never counted as workers
emu_slots = 2         # emulators at once (at most 10)
patience_s = 60       # how long a waiting job may be passed by later jobs that fit
force_s = 90          # when nothing runs, how long the first job waits for available memory before it starts on swap
poll_s = 1            # how often a waiting job looks again
stall_s = 600         # a running job silent and idle for this long is reported as stalled
kill_grace_s = 10     # between TERM and KILL when a job is stopped

# One section per kind: the memory a job of the kind is expected to use, and its Gradle workers.
[test]
mem_mib = 2800
workers = 4

[check]
mem_mib = 6000
workers = 8

[emu]
mem_mib = 6000
workers = 8
slot = yes
